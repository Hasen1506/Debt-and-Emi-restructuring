# Alembic (critique #63): schema migrations for the account database.
# The app runs them itself at start-up (api/db/database.py init_db), so a
# deploy needs no extra step. By hand:
#   DATABASE_URL=postgresql://… alembic upgrade head
#   DATABASE_URL=postgresql://… alembic revision -m "add x"   (then edit it)
[alembic]
script_location = api/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
