name: Data PR
description: >-
  Propose a data bot's changed files as a pull request and merge it once the
  bot's own data tests have passed (grill #65). Used by market-data,
  rate-disclosures and policy-rates. Run it AFTER the data tests.

  audit80 D17: data never goes to main without CI.
  * A PR opened with the built-in GITHUB_TOKEN does not start other
    workflows, so this action starts the full CI on the PR branch itself
    (`gh workflow run ci.yml --ref data/<bot>`; workflow_dispatch is the
    one event GITHUB_TOKEN may trigger). Its checks land on the PR's commit.
  * It then asks for auto-merge (`gh pr merge --auto --squash`): with
    branch protection requiring the CI checks, GitHub merges only after
    they pass. (Founder: protect main, require the CI checks, tick
    Settings > General > "Allow auto-merge".)
  * The old fallback that pushed straight to main when a PR could not be
    opened is gone: the job fails and the workflow's failure step says why.

  Repo variable DATA_PR_MODE=review leaves the PR open for a person.
inputs:
  bot:
    description: Short bot id; the PR branch is data/<bot>
    required: true
  paths:
    description: Space-separated files or directories the bot may change
    required: true
  title:
    description: PR title and commit message
    required: true
  body:
    description: PR body (Markdown)
    required: false
    default: "Figures re-read from their official sources by a scheduled job. The job ran the data tests before opening this PR."
  mode:
    description: "merge (default) or review"
    required: false
    default: merge
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BOT: ${{ inputs.bot }}
        PATHS: ${{ inputs.paths }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        MODE: ${{ inputs.mode }}
        BASE: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        if [ -z "$(git status --porcelain -- $PATHS)" ]; then
          echo "No change in $PATHS; nothing to propose." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        branch="data/$BOT"
        git checkout -B "$branch"
        # shellcheck disable=SC2086
        git add -- $PATHS
        git commit -q -m "$TITLE"
        git push -q --force origin "$branch"

        printf '%s\n\nRun: %s/%s/actions/runs/%s\n' "$BODY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/pr-body.md"
        open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
        if [ -z "$open" ]; then
          gh label create data-bot --color 0E8A16 --description "Opened by a scheduled data job" 2>/dev/null || true
          if ! gh pr create --base "$BASE" --head "$branch" --title "$TITLE" \
                 --body-file "$RUNNER_TEMP/pr-body.md" --label data-bot; then
            echo "::error::Could not open a PR. Tick Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'. Nothing was pushed to $BASE (audit80 D17)."
            echo "PR not allowed; nothing merged. See DEPLOY.md, 'Data bots'." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        else
          gh pr edit "$open" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
        fi

        if [ "$MODE" = "review" ]; then
          echo "PR left open for review (DATA_PR_MODE=review)." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # Full CI on the PR's head commit (GITHUB_TOKEN PRs start no workflows).
        if ! gh workflow run ci.yml --ref "$branch"; then
          echo "::warning::Could not start CI on $branch; auto-merge will wait for the required checks."
        fi
        # GitHub merges once the required checks pass (branch protection).
        if ! gh pr merge "$branch" --auto --squash --delete-branch; then
          echo "::error::Auto-merge was refused. Tick Settings > General > 'Allow auto-merge' and protect $BASE with the CI checks (audit80 D17). The PR stays open."
          exit 1
        fi
        echo "Auto-merge requested for the data PR for $BOT; it merges after CI passes." | tee -a "$GITHUB_STEP_SUMMARY"
