name: Data PR
description: >-
  Propose a data bot's changed files as a pull request and merge it once the
  bot's own data tests have passed (grill #65). Used by market-data,
  rate-disclosures and policy-rates. Run it AFTER the data tests.

  Cost: a PR opened with the built-in GITHUB_TOKEN does not start other
  workflows, so the full CI (Playwright and all) does not run on data PRs;
  the data tests the calling job already ran are the gate.

  Repo variable DATA_PR_MODE=review leaves the PR open for a person.
  If Actions may not open PRs (Settings > Actions > General > "Allow GitHub
  Actions to create and approve pull requests" unticked), it falls back to
  the old direct push so the data never stops, and says so in the summary.
inputs:
  bot:
    description: Short bot id; the PR branch is data/<bot>
    required: true
  paths:
    description: Space-separated files or directories the bot may change
    required: true
  title:
    description: PR title and commit message
    required: true
  body:
    description: PR body (Markdown)
    required: false
    default: "Figures re-read from their official sources by a scheduled job. The job ran the data tests before opening this PR."
  mode:
    description: "merge (default) or review"
    required: false
    default: merge
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BOT: ${{ inputs.bot }}
        PATHS: ${{ inputs.paths }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        MODE: ${{ inputs.mode }}
        BASE: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        if [ -z "$(git status --porcelain -- $PATHS)" ]; then
          echo "No change in $PATHS; nothing to propose." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        branch="data/$BOT"
        git checkout -B "$branch"
        # shellcheck disable=SC2086
        git add -- $PATHS
        git commit -q -m "$TITLE"
        git push -q --force origin "$branch"

        printf '%s\n\nRun: %s/%s/actions/runs/%s\n' "$BODY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/pr-body.md"
        open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
        if [ -z "$open" ]; then
          gh label create data-bot --color 0E8A16 --description "Opened by a scheduled data job" 2>/dev/null || true
          if ! gh pr create --base "$BASE" --head "$branch" --title "$TITLE" \
                 --body-file "$RUNNER_TEMP/pr-body.md" --label data-bot; then
            echo "::warning::Could not open a PR (is 'Allow GitHub Actions to create and approve pull requests' ticked?). Pushing to $BASE directly, as before."
            git push -q origin "HEAD:$BASE"
            git push -q origin --delete "$branch" || true
            echo "PR not allowed; pushed straight to $BASE (see DEPLOY.md, 'Data bots')." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
        else
          gh pr edit "$open" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
        fi

        if [ "$MODE" = "review" ]; then
          echo "PR left open for review (DATA_PR_MODE=review)." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        gh pr merge "$branch" --squash --delete-branch
        echo "Merged the data PR for $BOT after its data tests passed." | tee -a "$GITHUB_STEP_SUMMARY"
