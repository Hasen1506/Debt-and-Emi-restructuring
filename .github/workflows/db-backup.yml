name: Database backup

# audit80 D14, round 2. Full story, setup and restore: docs/BACKUPS.md.
#
# Nightly: pg_dump (Postgres 18 client, = Neon) of the Neon production database via a
# READ-ONLY role, a restore test into a throwaway Postgres 18 service
# container, age encryption (public key only), then the encrypted file goes
# to a PRIVATE GitHub repo (default Hasen1506/rightdue-backups) as one fresh
# orphan commit keeping 14 daily + 8 weekly copies, so that repo never grows
# a history. Needs no card and no paid service. Cloudflare R2 is an
# OPTIONAL second copy, used only when all four BACKUP_S3_* secrets exist.
#
# Weekly: a restore drill decrypts the newest STORED copy into a throwaway
# Postgres service container and checks every table's row count against the
# counts recorded when it was taken. Red + an issue on any mismatch, or when
# the newest copy is more than ~2 days old.
#
# Secrets: DATABASE_URL, BACKUP_AGE_RECIPIENT, BACKUP_REPO_TOKEN,
#          BACKUP_AGE_IDENTITY (drill only)
#          optional: BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT,
#                    BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY
# Variables (optional): BACKUP_REPO (default Hasen1506/rightdue-backups),
#          BACKUP_DISABLED=1, BACKUP_DRILL_DISABLED=1, BACKUP_ALLOW_EMPTY=1
#
# This repo is public, so these logs are public: the scripts print no data
# and no row counts (those go only into the private repo's MANIFEST.json).
# Minutes: standard GitHub-hosted runners are free for public repositories
# (docs.github.com/en/billing/concepts/product-billing/github-actions); the
# backup takes ~1-2 min a night and the drill ~1 min a week anyway.
on:
  schedule:
    - cron: "40 20 * * *"   # backup: 02:10 IST, after the evening's merges
    - cron: "10 23 * * 0"   # restore drill: Monday 04:40 IST
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        type: choice
        options: [backup, drill, both]
        default: backup

permissions:
  contents: read
  issues: write   # only to open an issue when a run fails

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  # Neon production runs PostgreSQL 18 (docs/neon-configuration.md); pg_dump
  # must be the same major or newer, so the client and the throwaway restore
  # server are both postgres:18. (Round 1 used 17: it would have failed.)
  PG_IMAGE: postgres:18
  AGE_VERSION: v1.2.1
  # sha256 of age-v1.2.1-linux-amd64.tar.gz from github.com/FiloSottile/age/releases
  AGE_SHA256: 7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50
  BACKUP_REPO: ${{ vars.BACKUP_REPO || 'Hasen1506/rightdue-backups' }}
  BACKUP_DISABLED: ${{ vars.BACKUP_DISABLED }}
  BACKUP_ALLOW_EMPTY: ${{ vars.BACKUP_ALLOW_EMPTY }}
  # The service container below: throwaway, on this runner, never production.
  RESTORE_URL: postgresql://postgres:throwaway@localhost:5432/postgres

jobs:
  backup:
    if: (github.event_name == 'workflow_dispatch' && inputs.job != 'drill') || github.event.schedule == '40 20 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      restore:
        image: postgres:18   # keep equal to PG_IMAGE
        env:
          POSTGRES_PASSWORD: throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github

      # Red (and an issue) when a required secret is missing; exits 0 with
      # run=false only when BACKUP_DISABLED=1 on purpose.
      - name: Check configuration
        id: cfg
        run: bash scripts/backup_preflight.sh

      - name: Tools (age, Postgres 18 client)
        if: steps.cfg.outputs.run == 'true'
        run: bash scripts/backup_ci_tools.sh

      - name: Dump, restore test, encrypt
        if: steps.cfg.outputs.run == 'true'
        run: |
          set -euo pipefail
          export WORK_DIR="$RUNNER_TEMP/backup" TMPDIR="$RUNNER_TEMP"
          file=$(bash scripts/backup_dump.sh)
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - name: Store in the private backup repo (14 daily + 8 weekly)
        if: steps.cfg.outputs.run == 'true'
        run: |
          set -euo pipefail
          TMPDIR="$RUNNER_TEMP" bash scripts/backup_push_github.sh "$BACKUP_FILE" "$RUNNER_TEMP/backup/entry.json"
          echo "Backup stored: $(basename "$BACKUP_FILE") in the private backup repo." >> "$GITHUB_STEP_SUMMARY"

      - name: Optional second copy (R2 / S3)
        if: steps.cfg.outputs.run == 'true' && steps.cfg.outputs.r2 == 'true'
        run: bash scripts/backup_push_r2.sh "$BACKUP_FILE"

      - name: Remove local files
        if: always()
        run: rm -rf "$RUNNER_TEMP/backup"

      - name: Open an issue if the backup failed
        if: failure()
        uses: ./.github/actions/failure-issue
        with:
          title: Database backup failed

  drill:
    needs: backup
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.job != 'backup') || github.event.schedule == '10 23 * * 0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      restore:
        image: postgres:18   # keep equal to PG_IMAGE
        env:
          POSTGRES_PASSWORD: throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
      BACKUP_DRILL_DISABLED: ${{ vars.BACKUP_DRILL_DISABLED }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github

      - name: Check configuration
        id: cfg
        run: bash scripts/backup_preflight.sh drill

      - name: Tools (age, Postgres 18 client)
        if: steps.cfg.outputs.run == 'true'
        run: bash scripts/backup_ci_tools.sh

      # Restore test of the STORED copy: decrypt the newest file in the
      # private repo, restore it into the service container, compare every
      # table's row count with its MANIFEST.json entry. Fails loudly.
      - name: Restore drill (throwaway Postgres 18)
        if: steps.cfg.outputs.run == 'true'
        run: |
          TMPDIR="$RUNNER_TEMP" bash scripts/backup_drill.sh
          echo "Restore drill passed $(date -u +%Y-%m-%d)." >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue if the drill failed
        if: failure()
        uses: ./.github/actions/failure-issue
        with:
          title: Backup restore drill failed
