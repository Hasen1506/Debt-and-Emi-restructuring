name: Long fuzz

# The normal CI runs a 300-loan slice. This runs all 20,000 loans and
# every hostile value in every field of every POST endpoint (~3 min).
on:
  schedule:
    - cron: "17 3 * * 1"      # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  fuzz:
    name: 20,000 loans through the API
    runs-on: ubuntu-latest
    timeout-minutes: 60  # UX50 E-23
    env:
      FUZZ_N: "20000"
      FUZZ_FULL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest api/tests/test_api_fuzz.py -q
