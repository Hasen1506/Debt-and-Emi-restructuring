name: Rate disclosures

# Weekly: read each bank's published loan-rate disclosure (the range and mean
# of rates on loans contracted last quarter, RBI 22 Jan 2015 para 2(a)) and
# propose a dated JSON as a PR when the figures changed (merged once the data
# tests pass; .github/actions/data-pr, grill #65). Banks publish quarterly;
# the weekly check costs about a runner-minute and commits only on change. See
# scripts/fetch_rate_disclosures.py and engine/rate_disclosures.py.
# A bank whose page can't be read is left out of that day's file; nothing is
# guessed or carried over.
on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rate-disclosures
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Fetch and read the banks' pages
        run: python scripts/fetch_rate_disclosures.py
      - name: The data still passes its checks
        run: python -m pytest engine/tests/test_rate_disclosures.py -q
      - name: Propose the new figures, if any
        uses: ./.github/actions/data-pr
        with:
          bot: rate-disclosures
          paths: api/data/rate_disclosures web/src/lib/rate-disclosures.json
          title: "data: banks' loan-rate disclosures as of ${{ github.run_started_at }}"
          mode: ${{ vars.DATA_PR_MODE || 'merge' }}
