name: Security

# audit80 D22: a security gate on every PR and on main, kept in its own file
# so it can be required separately in branch protection (ci.yml is owned by
# the code-health workstream). Fails on:
#   * a HIGH or CRITICAL advisory in the web app's production dependencies
#     (npm audit --omit=dev --audit-level=high);
#   * a known vulnerability in the Python requirements (pip-audit);
#   * a secret committed in the diff (gitleaks, free for public repos).
# Also: GitHub secret scanning + push protection are free on public repos;
# the founder switches them on in Settings > Code security (founder action).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "15 2 * * 1"   # Mondays 07:45 IST: new advisories on unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (production deps, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # --package-lock-only: reads the lock file, installs nothing.
      - run: npm audit --package-lock-only --omit=dev --audit-level=high

  pip-audit:
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.9.0
      # --disable-pip + --no-deps: audit exactly the pinned list, no resolver.
      - run: pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off

  secrets:
    name: Committed secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          ver=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          ./gitleaks git --log-opts="$range" --redact --no-banner --exit-code 1 .
