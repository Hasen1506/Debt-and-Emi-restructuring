name: CI

on:
  # Branch pushes are covered by their PR run; only main runs on push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every suite is deterministic: Hypothesis runs derandomized (the "ci"
# profile), differential cases come from fixed seeds, the E2E run uses a
# frozen clock with stubbed email/OTP and FX and no outside network.
# Nothing is retried or quarantined: a red test is a bug to fix.
env:
  HYPOTHESIS_PROFILE: ci
  PYTHONHASHSEED: "0"

jobs:
  python:
    name: Engine + API unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rightdue_test
          POSTGRES_PASSWORD: local-fixture-password
          POSTGRES_DB: rightdue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rightdue_test -d rightdue_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RIGHTDUE_TEST_DATABASE_URL: postgresql://rightdue_test:local-fixture-password@127.0.0.1:5432/rightdue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: >-
          python -m pytest engine/tests api/tests -q --durations=5
          --ignore-glob='*/test_property_*' --ignore-glob='*/test_differential_*'

  property:
    name: Property-based invariants (Hypothesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Invariants that must never break
        run: >-
          python -m pytest engine/tests/test_property_invariants.py api/tests/test_property_api.py
          -q --durations=20 --hypothesis-show-statistics

  differential:
    name: Differential (reference + pre-PR-29 engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the pre-PR-29 engine is read from commit c753849
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Engine vs exact reference, and vs c753849
        run: >-
          python -m pytest engine/tests/test_differential_reference.py
          engine/tests/test_differential_pre_pr29.py -q --durations=20

  web:
    name: Web typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Golden E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rightdue_e2e
          POSTGRES_PASSWORD: e2e-fixture-password
          POSTGRES_DB: rightdue_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rightdue_e2e -d rightdue_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_DATABASE_URL: postgresql://rightdue_e2e:e2e-fixture-password@127.0.0.1:5432/rightdue_e2e
      E2E_PYTHON: python
      E2E_FROZEN_NOW: "2026-10-07T04:30:00.000Z"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build the web app against the local API
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100
          API_BASE_URL: http://127.0.0.1:8100
      - name: Golden journeys
        run: npx playwright test
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
