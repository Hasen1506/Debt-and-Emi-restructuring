name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Engine + API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rightdue_test
          POSTGRES_PASSWORD: local-fixture-password
          POSTGRES_DB: rightdue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rightdue_test -d rightdue_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RIGHTDUE_TEST_DATABASE_URL: postgresql://rightdue_test:local-fixture-password@127.0.0.1:5432/rightdue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest engine/tests api/tests -q

  web:
    name: Web typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
