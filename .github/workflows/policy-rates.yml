name: Policy rates

# Weekly: re-read the RBI repo rate (rbi.org.in) and the Fed funds target
# (FRED) and propose api/data/policy_rates_live.json as a PR only when it
# should change: a new decision, the first check after a scheduled MPC/FOMC
# meeting, or a 30-day heartbeat (scripts/fetch_policy_rates.py, grill #61).
# Replaces the API's old 6-hourly background thread. Rates change only at
# meetings (RBI 6 a year, Fed 8), so a weekly check lags a decision by at
# most ~5 days; press "Run workflow" the day after a meeting to record it at
# once. A source that can't be read turns the run red (GitHub emails the
# owner) and the last good values stay in use.
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC (08:30 IST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: policy-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Read RBI and FRED
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_policy_rates.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Data tests only
        run: python -m pytest api/tests/test_rates_feed.py api/tests/test_loan_check.py -q -p no:cacheprovider
      - name: Propose the new file, if any
        uses: ./.github/actions/data-pr
        with:
          bot: policy-rates
          paths: api/data/policy_rates_live.json
          title: "data: policy rates as of ${{ github.run_started_at }}"
          mode: ${{ vars.DATA_PR_MODE || 'merge' }}
      - name: Fail the run if a source could not be read
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::A policy-rate source could not be read; the last good values stay in use. See the summary."
          exit 1
