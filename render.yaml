# Render Blueprint — declarative two-service deploy.
# After you click "New Blueprint" in Render and point it at this repo, Render
# will prompt you to fill in CORS_ORIGINS and NEXT_PUBLIC_API_BASE_URL on first
# deploy. You can grab those URLs from the service detail pages once they exist.
#
# Trial mode (no Postgres, no email): leave DATABASE_URL unset on the API and
# set NEXT_PUBLIC_DISABLE_AUTH=true on the web. The engine routes work fully;
# auth + cross-device sync are skipped. To enable auth later, add a Postgres
# service (block below — uncomment), set DATABASE_URL via fromDatabase, set
# RESEND_API_KEY, and unset NEXT_PUBLIC_DISABLE_AUTH.

services:
  # ─── FastAPI backend ────────────────────────────────────────────────
  - type: web
    name: finoptima-api
    runtime: python
    plan: free                     # $0/mo, sleeps after 15 min idle. Use `starter` for always-on ($7/mo).
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: PYTHONPATH
        value: .
      - key: CORS_ORIGINS
        sync: false                # Fill in the dashboard: e.g. https://finoptima-web.onrender.com
      # Rate limits (api/security.py): the web server's own calls send this
      # token and are not limited. Generated here, copied to the web below.
      - key: INTERNAL_API_TOKEN
        generateValue: true
      # Render's proxy appends the client address to X-Forwarded-For; read
      # one hop back. Confirm after the first deploy (ROADMAP 6.4).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Shared outcome reports (api/outcomes_store.py) keep a keyed hash of
      # the client address for the daily limit, never the address itself.
      - key: OUTCOMES_IP_KEY
        generateValue: true
      # "labelled" shows the lender scorecard marked unverified; "hidden"
      # keeps it back until reports can be verified (owner decision).
      - key: SCORECARD_MODE
        value: labelled
      # Without DATABASE_URL, outcome reports go to a local SQLite file,
      # which the free plan wipes on every deploy.
      # Uncomment when you provision a Postgres add-on:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: finoptima-db
      #     property: connectionString
      # - key: RESEND_API_KEY
      #   sync: false

  # ─── Next.js frontend ───────────────────────────────────────────────
  - type: web
    name: finoptima-web
    runtime: node
    plan: free                     # $0/mo, sleeps after 15 min idle. Use `starter` for always-on.
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --port $PORT --hostname 0.0.0.0
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: INTERNAL_API_TOKEN
        fromService:
          type: web
          name: finoptima-api
          envVarKey: INTERNAL_API_TOKEN
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false                # Fill in the dashboard: e.g. https://finoptima-api.onrender.com
      - key: NEXT_PUBLIC_DISABLE_AUTH
        value: "true"              # Trial mode — bypasses /login until DB+email are wired up.

# Uncomment to provision a Render Postgres add-on alongside the API:
# databases:
#   - name: finoptima-db
#     plan: free                   # 90-day trial then ~$7/mo; otherwise data is wiped.
#     databaseName: finoptima
#     user: finoptima
