# RightDue Render Blueprint — ONE free web service (Dockerfile at the repo
# root) running FastAPI and Next.js together, so a visit wakes one instance
# instead of two and the API is already up when the page has loaded.
#
#   browser ─▶ Render edge (Cloudflare-operated, Render's) ─▶ Render LB ─▶ Next.js :$PORT
#                                                      └─▶ FastAPI 127.0.0.1:8000
#
# Next.js serves the pages, /api/session/*, /api/holdings/quote and
# /api/healthz (the health check); every other /api/* path (including
# /api/health) is proxied to FastAPI inside the
# container (web/next.config.mjs). The browser only ever talks to one origin,
# so CORS_ORIGINS and NEXT_PUBLIC_API_BASE_URL are no longer needed.
#
# Render cannot switch an existing service from python/node to docker, so this
# is a NEW service. Cutover (DEPLOY.md, "Single service"): sync the Blueprint,
# fill DATABASE_URL / RESEND_API_KEY / RESEND_FROM / WEB_ORIGIN, move the
# rightdue.app custom domain to `rightdue`, then delete the two old services.
#
# Existing deployment: rightdue-db is provisioned separately (Neon).
# Authentication mode (NEXT_PUBLIC_DISABLE_AUTH) is compiled into the web
# bundle at build time; changing it needs a redeploy (with build cache cleared
# if Render reuses the old build).

services:
  - type: web
    name: rightdue
    runtime: docker
    plan: free                     # $0/mo, 512 MB, sleeps after 15 min idle. `starter` for always-on.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Live re-test 3 NEW-19: answered by Next.js itself (web/src/app/api/
    # healthz/route.ts, prerendered), not proxied to FastAPI. Through the
    # proxy, a busy API on 0.15 CPU made the 5 s check time out and Render
    # returned 502s. If FastAPI dies, deploy/start.sh exits the container,
    # so this still catches a dead API. Changing it needs a Blueprint sync
    # (or the same value under Settings > Health Check Path).
    healthCheckPath: /api/healthz
    envVars:
      # ── Secrets: copy these from the old finoptima-api service ──────────
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Sender for sign-in codes, on a domain verified in Resend, e.g.
      # "RightDue <signin@rightdue.app>". Without it the code falls back to
      # onboarding@resend.dev, which Resend delivers ONLY to the Resend
      # account owner, so real users never get their code (BUG_REPORT M8).
      - key: RESEND_FROM
        sync: false
      # ── Generated ──────────────────────────────────────────────────────
      # Rate limits (api/security.py): the web server's own engine calls send
      # this token and are not limited. Same process env for both halves now.
      - key: INTERNAL_API_TOKEN
        generateValue: true
      # Shared outcome reports (api/outcomes_store.py) keep a keyed hash of
      # the client address for the daily limit, never the address itself.
      # A new value only resets today's per-address counts; copy the old
      # one from finoptima-api to keep them.
      - key: OUTCOMES_IP_KEY
        generateValue: true
      # ── Client address for rate limits (api/client_ip.py) ──────────────
      # UX50 E-01: rightdue.app's DNS points straight at Render (name.com NS,
      # A 216.24.57.1); our own Cloudflare zone is NOT in the path. Render
      # fronts every service with its own Cloudflare edge, then its load
      # balancer, so the container sees
      #   X-Forwarded-For: <visitor>, <Cloudflare edge>, <Render LB 10.x>
      #   CF-Connecting-IP: <visitor>   (set by the edge; clients can't forge it)
      # The API keys rate limits on CF-Connecting-IP whenever RENDER is set
      # (Render sets it on every service), so this works with no env change.
      # TRUSTED_PROXY_HOPS is only the fallback when that header is missing;
      # 3 matches the chain above (the old "2" picked the rotating edge
      # address, which is why no 429 was ever sent). Next.js passes
      # X-Forwarded-For through unchanged and adds no hop.
      # If rightdue.app is ever proxied through our own Cloudflare zone
      # (orange cloud), CF-Connecting-IP still carries the visitor; leave it.
      # CLIENT_IP_HEADER=none turns the header off (hop logic only).
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      # ── Cookies and CSRF (same origin now) ─────────────────────────────
      - key: COOKIE_SECURE
        value: "1"
      - key: COOKIE_SAMESITE
        value: lax
      # Browser origin(s) allowed to POST sign-in and account writes through
      # /api/session (CSRF check). Comma-separated, exact scheme + host:
      # "https://rightdue.app,https://<this service>.onrender.com". If unset
      # the web server rebuilds the origin from X-Forwarded-Proto/-Host.
      - key: WEB_ORIGIN
        sync: false
      # ── App settings ───────────────────────────────────────────────────
      # "hidden" (default, critique #55) keeps lender figures back; "verified"
      # shows figures from reports checked against the bank's reply only;
      # "labelled" shows every report, marked unverified.
      - key: SCORECARD_MODE
        value: hidden
      # false for accounts, true only for an explicit local trial. Build-time
      # value (passed to the Docker build as a build arg).
      - key: NEXT_PUBLIC_DISABLE_AUTH
        sync: false

