[project]
name = "debt-emi-api"
version = "0.1.0"
description = "FastAPI gateway exposing the debt-emi engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "pydantic[email]==2.10.4",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
