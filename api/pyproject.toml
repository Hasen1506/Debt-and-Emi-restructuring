[project]
name = "debt-emi-api"
version = "0.1.0"
description = "FastAPI gateway exposing the debt-emi engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "pydantic[email]==2.10.4",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "python-dotenv==1.0.1",
    "resend==2.5.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
