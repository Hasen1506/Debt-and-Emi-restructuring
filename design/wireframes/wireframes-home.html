<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emi — Module 02 Home Wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --soft: #9a9a9a;
    --border: #cfcfcf;
    --dash: #b8b8b8;
    --card: #ffffff;
    --canvas: #f0eee9;
    --accent: #c96442;
    --positive: #2d6a4f;
    --soft-bg: #f3efe9;
    --calm-bg: #ffffff;
    --overwhelmed-bg: #faf6f0;
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--canvas); font-family: var(--font-sans); color: var(--ink); }

  /* ── WIREFRAME ARTBOARD PRIMITIVES ── */
  .wf {
    width: 100%;
    height: 100%;
    background: var(--calm-bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-size: 13px;
    line-height: 1.4;
  }
  .wf-overwhelmed { background: var(--overwhelmed-bg); }
  .wf header.wf-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--border);
  }
  .wf .country-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 8px; border: 1px solid var(--border); border-radius: 14px;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    background: #fff;
  }
  .wf .settings-icon {
    width: 22px; height: 22px; border: 1px solid var(--border); border-radius: 4px;
    display: grid; place-items: center; font-size: 11px; color: var(--muted);
  }
  .wf .body {
    flex: 1; overflow-y: auto; padding: 16px 18px 80px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .wf .body::-webkit-scrollbar { display: none; }

  /* Card primitives */
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 16px;
  }
  .card-soft { background: var(--soft-bg); border-color: var(--dash); }
  .card-flat { background: transparent; border: none; padding: 0; }
  .card-headline {
    background: linear-gradient(180deg, #fff 0%, #fafaf7 100%);
    border: 1px solid var(--border);
  }

  .label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--soft); margin-bottom: 6px;
  }
  .label-accent { color: var(--accent); }
  .label-positive { color: var(--positive); }

  .big-number {
    font-family: var(--font-sans); font-size: 32px; font-weight: 700; letter-spacing: -0.02em;
    line-height: 1; color: var(--ink);
  }
  .big-number .unit { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .med-number {
    font-family: var(--font-mono); font-size: 18px; font-weight: 500;
    color: var(--ink);
  }
  .meta { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .meta-mono { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  .insight-line { font-size: 14px; line-height: 1.5; color: var(--ink); }
  .insight-line .accent { color: var(--accent); font-weight: 500; }

  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

  .btn {
    padding: 10px 14px; border-radius: 6px; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; font-family: var(--font-sans);
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .btn-secondary { background: #fff; color: var(--ink); }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--muted); }
  .btn-block { display: block; width: 100%; text-align: center; }

  /* Tool tiles */
  .tools {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  }
  .tool {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 8px; background: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 10px; line-height: 1.2; text-align: center; color: var(--ink);
  }
  .tool-icon {
    width: 28px; height: 28px; border: 1px dashed var(--dash); border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; color: var(--soft);
    font-family: var(--font-mono);
  }

  /* Placeholder pattern */
  .ph {
    border: 1px dashed var(--dash); background:
      repeating-linear-gradient(135deg,
        rgba(0,0,0,0.02) 0 4px,
        transparent 4px 8px);
    color: var(--soft); padding: 12px; font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    border-radius: 4px;
  }
  .ph-chart { height: 80px; display: grid; place-items: center; }
  .ph-sparkline { height: 32px; }

  /* Confidence stars */
  .stars {
    display: inline-flex; gap: 1px; font-size: 9px; color: var(--soft);
    margin-left: 6px; vertical-align: middle;
  }
  .star-on { color: var(--ink); }

  /* Footer of artboard */
  .wf-footer {
    border-top: 1px solid var(--border);
    padding: 10px 18px; display: flex; justify-content: space-between;
    font-size: 10px; color: var(--soft); font-family: var(--font-mono);
    background: #fff;
  }
  .wf-overwhelmed .wf-footer { background: transparent; }
  .overwhelm-link { color: var(--accent); text-decoration: underline; cursor: pointer; }
  .mode-toggle {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border);
    border-radius: 10px; padding: 1px;
  }
  .mode-toggle span { padding: 2px 8px; border-radius: 8px; }
  .mode-toggle .on { background: var(--ink); color: #fff; }

  /* Mode-specific tweaks */
  .wf-overwhelmed .card { border-color: #d8d0c2; background: #fffdf9; }
  .wf-overwhelmed .ph { border-color: #d8d0c2; }
  .wf-detailed .card { padding: 14px; }
  .wf-detailed .body { gap: 12px; }

  /* Sensitivity strip */
  .sens {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--border); border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden;
  }
  .sens > div { background: #fff; padding: 10px 12px; }
  .sens .lbl {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--soft); margin-bottom: 4px;
  }
  .sens .val { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }

  /* Debt row */
  .debt-row {
    display: grid; grid-template-columns: 14px 1fr auto auto;
    align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 12px;
  }
  .debt-row:last-child { border-bottom: none; }
  .debt-row .rank {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); color: #fff; font-size: 9px; display: grid; place-items: center;
    font-family: var(--font-mono);
  }
  .debt-row .rank-low { background: #fff; color: var(--soft); border: 1px solid var(--border); }
  .debt-row .name { color: var(--ink); }
  .debt-row .name-sub {
    display: block; font-family: var(--font-mono); font-size: 9px; color: var(--soft);
    margin-top: 2px;
  }
  .debt-row .rate {
    font-family: var(--font-mono); font-size: 11px; color: var(--accent);
  }
  .debt-row .bal {
    font-family: var(--font-mono); font-size: 11px; color: var(--ink);
  }

  /* Action card highlight */
  .action {
    border: 1.5px solid var(--ink);
    box-shadow: 0 1px 0 var(--ink);
  }

  /* Overwhelmed special "Take a breath" card */
  .breath-card {
    background: #fffdf9;
    border: 1px solid #d8d0c2;
    border-radius: 12px;
    padding: 24px 20px;
    text-align: left;
  }
  .breath-h {
    font-size: 13px; color: var(--muted); margin-bottom: 16px;
    font-family: var(--font-sans);
  }
  .breath-action {
    font-size: 22px; font-weight: 500; line-height: 1.3;
    margin-bottom: 16px; color: var(--ink);
  }
  .breath-cta {
    display: block; width: 100%; padding: 14px;
    background: var(--ink); color: #fff;
    border-radius: 8px; border: none;
    font-family: var(--font-sans); font-size: 14px; font-weight: 500;
    text-align: center; cursor: pointer; margin-top: 8px;
  }

  /* Caption strip under each artboard */
  .caption {
    font-family: var(--font-mono); font-size: 11px; color: rgba(60,50,40,0.65);
    line-height: 1.5;
  }
  .caption strong { color: rgba(40,30,20,0.9); font-weight: 600; }
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

// ── Wireframe screen components (inlined) ─────────────────────────────
function TopBar({ countryFlag = '🇮🇳', countryCode = 'IN', settings = '⚙' }) {
  return (
    <header className="wf-top">
      <span className="country-chip">{countryFlag} {countryCode}</span>
      <span className="settings-icon">{settings}</span>
    </header>
  );
}

function ToolsRow() {
  const items = [
    { code: 'W', name: 'Windfall' },
    { code: 'N', name: 'New EMI?' },
    { code: 'S', name: 'Sell asset?' },
    { code: '✓', name: 'Paid extra' },
    { code: '$', name: 'Cash yield' },
    { code: '⏳', name: 'Wait or borrow?' },
  ];
  return (
    <div>
      <div className="label">Tools</div>
      <div className="tools">
        {items.map(t => (
          <div className="tool" key={t.code}>
            <div className="tool-icon">{t.code}</div>
            <div>{t.name}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ModeFooter({ mode = 'Simple' }) {
  return (
    <footer className="wf-footer">
      <span className="overwhelm-link">feeling overwhelmed?</span>
      <span className="mode-toggle">
        <span className={mode === 'Simple' ? 'on' : ''}>Simple</span>
        <span className={mode === 'Detailed' ? 'on' : ''}>Detailed</span>
      </span>
    </footer>
  );
}

function NotesCard() {

  function App() {

          subtitle="The same data, three different presentations. Toggle Simple⇆Detailed and Calm⇆Overwhelmed. Three live combinations; Detailed×Overwhelmed not exposed."
        >
          <DCArtboard id="home-simple-calm" label="01 · Simple × Calm  (default)" width={380} height={780}>
            <HomeSimpleCalm />
          </DCArtboard>
          <DCArtboard id="home-detailed-calm" label="02 · Detailed × Calm" width={380} height={780}>
            <HomeDetailedCalm />
          </DCArtboard>
          <DCArtboard id="home-simple-overwhelmed" label="03 · Simple × Overwhelmed" width={380} height={780}>
            <HomeSimpleOverwhelmed />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="notes"
          title="Reading guide"
          subtitle="What to look for in each artboard, and what's intentionally placeholder vs. specified."
        >
          <DCArtboard id="notes-card" label="Designer's notes" width={780} height={420}>
            <NotesCard />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
