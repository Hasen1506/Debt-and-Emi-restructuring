<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Insides · Ledger skin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <style>
      html, body { margin: 0; padding: 0; background: #fbfaf3; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="app-content.js"></script>
    <script type="text/babel" src="design-canvas.jsx"></script>
    <script type="text/babel" src="ledger-skin-home.jsx"></script>
    <script type="text/babel" src="ledger-skin-rest.jsx"></script>
    <script type="text/babel" src="ledger-skin-v2.jsx"></script>
    <script type="text/babel" src="ledger-skin-v2-screens.jsx"></script>

    <script type="text/babel">
      function App() {
        return (
          <DesignCanvas>
            <DCSection
              id="ledger-v2"
              title="Ledger · V2 — missing features re-introduced"
              subtitle="HOME — full rebuild from your critique. Trust-first: every figure traceable. (1) Context bar with tax regime, plan-start, marginal — repeated from setup. (2) STATUS KPIs — NEXT ACTION cell removed (no orphan 'pay X'); BUDGET relabelled SCHEDULED · MAY with 'MODELLED · +6% INF · +8% HIKE @ APR'. (3) ASSUMPTIONS strip — the 2nd thing user views: strategy, plan-start, inflation, hike rate + month, EF split, FX, regime, marginal, min-EMI — all editable inline. (4) PAY THIS MONTH ledger — replaces 'Do This' card + glitched waterfall: 8 precise rows (₹16,543 not ₹18.5k), per-row [MARK PAID] [PARTIAL] [SNOOZE] register, single allocation-shape bar at the bottom (no duplicate idle legend). (5) RESTRUCTURE marquee — promoted ABOVE Open Positions: each opportunity has an inline [NEGOTIATE SCRIPT] action that opens a phone-ready template. (6) DEBTS table on Home with link to /debts. (7) MORE TOOLS — smaller, no § symbols, plain names. DEBTS v2 — breakdown panel gets [EDIT ENTRY] + per-row EDIT, floating-rate dual display (current rate + RBI-dependence callout), cash management shows the 'idle' threshold definition explicitly."
            >
              <DCArtboard id="v2-home"            label="Home · V2 — Pay This Month now compact (WHY/STATUS collapsed inline); stale-card nudge ported here from Debts; no yellow tinge on highlight rows" width={1200} height={2400}><LHomeV2 /></DCArtboard>
              <DCArtboard id="v2-plan"            label="Plan · V2 (full missing list folded in)"    width={1200} height={2600}><LPlanV2 /></DCArtboard>
              <DCArtboard id="v2-insights"        label="Notes · V2 — per-loan trajectory removed; Lifecycle Events ported here from Debts" width={1200} height={1700}><LInsightsV2 /></DCArtboard>
              <DCArtboard id="v2-goals-tools"     label="Goals & Tools · MERGED · Goals ledger + sandbox + 7 one-question tools" width={1200} height={1700}><LGoalsScreen /></DCArtboard>
              <DCArtboard id="v2-activity"        label="Activity · NEW central registration hub · every payment, rate, expense, income, lifecycle event logs here · modal preview pinned open" width={1200} height={1800}><LActivityScreen /></DCArtboard>
              <DCArtboard id="v2-tax"             label="Tax · NEW (business-only) · advance tax + deductions"    width={1200} height={1100}><LTaxScreen /></DCArtboard>
              <DCArtboard id="v2-portfolio"       label="Portfolio · NEW · holdings + liquidation order + CASH (ported from Debts)" width={1200} height={1500}><LPortfolioScreen /></DCArtboard>
              <DCArtboard id="v2-windfall"        label="Windfall · per-target sliders · debts by highest APR + goals · engine pick / manual"  width={1200} height={1700}><LWindfallV2 /></DCArtboard>
            </DCSection>

            <DCSection
              id="ledger-desktop"
              title="Ledger skin · Desktop (original · for reference)"
              subtitle="The previous Ledger spec — kept here so you can compare each V2 screen above against the original. Home Detailed is removed per your decision; SIMPLE and OVERWHELMED remain."
            >
              <DCArtboard id="l-home-simple"      label="Home · Simple × Calm  (daily statement)"    width={1200} height={920}><LHomeSimple /></DCArtboard>
              <DCArtboard id="l-home-overwhelmed" label="Home · Simple × Overwhelmed  (soft view)"   width={1200} height={760}><LHomeOverwhelmed /></DCArtboard>
              <DCArtboard id="l-plan"             label="Plan · trajectory + amortisation + what-if"  width={1200} height={1900}><LPlanScreen /></DCArtboard>
              <DCArtboard id="l-debts"            label="Debts · full ledger + highlighted detail"   width={1200} height={1180}><LDebtsScreen /></DCArtboard>
              <DCArtboard id="l-insights"         label="Notes · the engine's commentary"            width={1200} height={1080}><LInsightsScreen /></DCArtboard>
              <DCArtboard id="l-onboarding"       label="Setup · step 3 of 6 (Loans)"                width={1200} height={1080}><LOnboardingScreen /></DCArtboard>
              <DCArtboard id="l-tools"            label="Tools · 7 one-question tools"               width={1200} height={780}><LToolsIndex /></DCArtboard>
              <DCArtboard id="l-tools-windfall"   label="Tools · §8a Windfall, a transaction slip"   width={1200} height={1280}><LWindfallScreen /></DCArtboard>
            </DCSection>

            <DCSection
              id="ledger-mobile"
              title="Ledger skin · Mobile (original)"
              subtitle="Tables stay tables — they scroll horizontally rather than reflow. Density is the point. Type stays at 11–12px because monospace at smaller sizes is illegible."
            >
              <DCArtboard id="l-m-home-simple"      label="Home · Simple"               width={390} height={1080}><LHomeSimple     mobile /></DCArtboard>
              <DCArtboard id="l-m-home-overwhelmed" label="Home · Overwhelmed"          width={390} height={760}><LHomeOverwhelmed mobile /></DCArtboard>
              <DCArtboard id="l-m-plan"             label="Plan"                        width={390} height={2000}><LPlanScreen      mobile /></DCArtboard>
              <DCArtboard id="l-m-debts"            label="Debts"                       width={390} height={1280}><LDebtsScreen     mobile /></DCArtboard>
              <DCArtboard id="l-m-insights"         label="Notes"                       width={390} height={1380}><LInsightsScreen mobile /></DCArtboard>
              <DCArtboard id="l-m-onboarding"       label="Setup"                       width={390} height={1280}><LOnboardingScreen mobile /></DCArtboard>
              <DCArtboard id="l-m-tools"            label="Tools"                       width={390} height={1100}><LToolsIndex     mobile /></DCArtboard>
              <DCArtboard id="l-m-tools-windfall"   label="Tools · Windfall"            width={390} height={1620}><LWindfallScreen mobile /></DCArtboard>
            </DCSection>
          </DesignCanvas>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
